name: zammpy_app
description: "Zammpy — App móvil para gestión de menús digitales."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # Navegación — equivalente a react-router-dom
  go_router: ^14.2.7

  # Estado global — equivalente a React Context API
  provider: ^6.1.2

  # HTTP
  http: ^1.2.1

  # Almacenamiento seguro (JWT tokens)
  flutter_secure_storage: ^9.2.2

  # SVG
  flutter_svg: ^2.0.10+1

  # Geolocalización
  geolocator: ^14.0.2

  # Compartir contenido con otras apps (sistema share sheet)
  share_plus: ^10.0.2

  # Google Sign-In nativo (selector de cuentas Android)
  google_sign_in: ^6.2.2

  # Íconos Material adicionales
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logos/launcher-icon.png"
  adaptive_icon_background: "assets/logos/launcher-icon.png"
  adaptive_icon_foreground: "assets/logos/launcher-icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/logos/
