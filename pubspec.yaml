name: zammpy_app
description: "Zammpy — App móvil para gestión de menús digitales."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # Navegación — equivalente a react-router-dom
  go_router: ^14.2.7

  # Estado global — equivalente a React Context API
  provider: ^6.1.2

  # HTTP
  http: ^1.2.1
  http_parser: ^4.0.2

  # Almacenamiento seguro (JWT tokens)
  flutter_secure_storage: ^9.2.2

  # SVG
  flutter_svg: ^2.0.10+1

  # WebView — para menú público en-app, pagos Wompi en-app, OAuth Google en-app
  webview_flutter: ^4.10.0

  # Geolocalización
  geolocator: ^14.0.2

  # WebSocket (notificaciones en tiempo real)
  stomp_dart_client: ^3.0.1

  # Notificaciones push locales
  flutter_local_notifications: ^17.2.3

  # Selector de imágenes
  image_picker: ^1.1.2

  # Lanzar URLs externas (solo cuando sea necesario)
  url_launcher: ^6.3.1

  # SQLite para caché local
  sqflite: ^2.3.3

  # Íconos Material adicionales
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logos/launcher-icon.png"
  adaptive_icon_background: "#4A37F2"
  adaptive_icon_foreground: "assets/logos/launcher-foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/logos/
